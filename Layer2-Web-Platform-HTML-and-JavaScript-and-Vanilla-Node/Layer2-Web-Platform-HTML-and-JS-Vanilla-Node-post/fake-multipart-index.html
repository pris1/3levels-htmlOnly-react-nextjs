<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <label for="recipe">Enter Recipe</label>
    <input type="text" name="name" placeholder="recipe" id="recipe" />
    <br />
    <label for="">Upload file</label>
    <input
      type="file"
      name="recipeText"
      placeholder="Upload file"
      id="fileUpload"
    />
    <br /><br />

    <button type="submit">Submit</button>

    <p id="result"></p>

    <script type="module" src="./fakea-multipart-app.js">
           
    </script>
  </body>
</html>
